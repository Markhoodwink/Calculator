name: Build & Release MB-CAL

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test MB-CAL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testGithubDebugUnitTest

      - name: Decode Keystore (if secret provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > $HOME/release.jks
            echo "KEYSTORE_FILE=$HOME/release.jks" >> $GITHUB_ENV
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleGithubRelease
          cp app/build/outputs/apk/github/release/app-github-release.apk MB-CAL-${{ github.ref_name }}.apk

      - name: Extract Russian Release Notes from README
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python3 -c "
          import re, os, subprocess

          tag_name = os.environ.get('REF_NAME', '')
          ver = tag_name.lstrip('v')

          notes = ''
          if os.path.exists('README.md'):
              with open('README.md', 'r', encoding='utf-8') as f:
                  content = f.read()

              pattern = r'^##\s+.*версии\s+' + re.escape(ver) + r'\b'
              match = re.search(pattern, content, flags=re.MULTILINE)
              if match:
                  start_idx = match.end()
                  end_match = re.search(r'^\s*---\s*$|^##\s+', content[start_idx:], flags=re.MULTILINE)
                  if end_match:
                      section = content[start_idx:start_idx + end_match.start()]
                  else:
                      section = content[start_idx:]
                  notes = section.strip()

          if not notes:
              try:
                  notes = subprocess.check_output(['git', 'log', '-1', '--pretty=%B'], text=True).strip()
              except Exception:
                  notes = 'Release ' + tag_name

          with open('release_notes.md', 'w', encoding='utf-8') as f:
              f.write(notes + '\n')
          "
        env:
          REF_NAME: ${{ github.ref_name }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "MB-CAL ${{ github.ref_name }}"
          body_path: release_notes.md
          files: MB-CAL-${{ github.ref_name }}.apk
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
